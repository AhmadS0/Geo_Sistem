<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Peta Lokal - Lili & Ahmad</title>
    
    <!-- 1. Leaflet CSS (Untuk rupa dan gaya komponen peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- 2. Tailwind CSS (Untuk gaya UI moden dan kemas) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Tetapan tinggi peta agar memenuhi ruang */
        #map {
            height: 550px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navigasi -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-emerald-400">🌐 Peta Digital Lokal</h1>
                <p class="text-xs text-slate-400">Projek IoT & Integrasi Sistem (Lili & Ahmad)</p>
            </div>
            <div class="flex gap-2">
                <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded-full font-medium border border-emerald-500/20">Fasa 1: Lokal</span>
            </div>
        </div>
    </header>

    <!-- Kandungan Utama (Main Content) -->
    <main class="max-w-6xl w-full mx-auto p-4 flex-grow flex flex-col gap-4">
        
        <!-- Panel Kawalan Ringkas -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🗺️</span>
                <div>
                    <h3 class="font-semibold">Tukar Gaya Peta</h3>
                    <p class="text-xs text-slate-400">Ubah rupa bumi secara dinamik menggunakan API lapisan (layers)</p>
                </div>
            </div>
            
            <!-- Butang Penukar Gaya Peta -->
            <div class="flex gap-2">
                <button onclick="tukarGaya('jalan')" id="btn-jalan" class="px-4 py-2 bg-emerald-500 text-slate-950 font-bold text-sm rounded-lg shadow hover:bg-emerald-400 transition">
                    Peta Jalanan
                </button>
                <button onclick="tukarGaya('topografi')" id="btn-topografi" class="px-4 py-2 bg-slate-700 text-slate-300 font-bold text-sm rounded-lg hover:bg-slate-600 transition">
                    Rupa Bumi (Terrain)
                </button>
            </div>
        </div>

        <!-- Ruang Peta -->
        <div class="relative">
            <div id="map"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-xs text-slate-500">
        Pembangunan Bersama &copy; 2026 Ahmad & Lili. Dijana menggunakan Leaflet.js & OpenStreetMap.
    </footer>

    <!-- 3. Leaflet JavaScript (Fungsi logik kawalan peta) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // A. Koordinat permulaan (Kuala Lumpur: [3.1390, 101.6869])
        const koordinatMula = [3.1390, 101.6869];
        const zoomAsal = 13;

        // B. Mengaktifkan peta di dalam div ber-ID 'map'
        const map = L.map('map').setView(koordinatMula, zoomAsal);

        // C. Mendefinisikan 2 jenis Gaya Peta (API Layers) yang berbeza
        
        // 1. Gaya Peta Standard (Street Map)
        const gayaJalanan = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // 2. Gaya Peta Rupa Bumi (Topografi / Terrain)
        const gayaTopografi = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Peta: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
        });

        // Aktifkan gaya jalanan secara lalai (default)
        gayaJalanan.addTo(map);

        // D. Menambah penanda lokasi (Marker) di Kuala Lumpur
        const penanda = L.marker(koordinatMula).addTo(map);
        penanda.bindPopup("<b>Helo Ahmad!</b><br>Ini adalah pusat bandar Kuala Lumpur.").openPopup();

        // E. Fungsi untuk menukar gaya peta apabila butang ditekan
        function tukarGaya(jenis) {
            const btnJalan = document.getElementById('btn-jalan');
            const btnTopo = document.getElementById('btn-topografi');

            if (jenis === 'jalan') {
                map.removeLayer(gayaTopografi);
                gayaJalanan.addTo(map);
                
                // Kemas kini gaya butang
                btnJalan.className = "px-4 py-2 bg-emerald-500 text-slate-950 font-bold text-sm rounded-lg shadow transition";
                btnTopo.className = "px-4 py-2 bg-slate-700 text-slate-300 font-bold text-sm rounded-lg hover:bg-slate-600 transition";
            } else if (jenis === 'topografi') {
                map.removeLayer(gayaJalanan);
                gayaTopografi.addTo(map);
                
                // Kemas kini gaya butang
                btnTopo.className = "px-4 py-2 bg-emerald-500 text-slate-950 font-bold text-sm rounded-lg shadow transition";
                btnJalan.className = "px-4 py-2 bg-slate-700 text-slate-300 font-bold text-sm rounded-lg hover:bg-slate-600 transition";
            }
        }
    </script>
</body>
</html>
